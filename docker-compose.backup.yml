version: '3'

# Backup quotidien (3h) de tous les clients (.env.<client>) dans backups/<client>/, 5 derniers conservés.
# Lancement     : docker compose -f docker-compose.backup.yml -p actistat_backup up -d
# Backup manuel : docker compose -f docker-compose.backup.yml -p actistat_backup run --rm backup sh /backup.sh

networks:
  pgbouncer:
    external: true

services:
  backup:
    # pg_dump/pg_restore 15 = version du serveur PostgreSQL OVH
    image: postgres:15-alpine
    container_name: actistat_backup
    environment:
      TZ: Europe/Paris
      ENV_DIR: /envs
      BACKUP_DIR: /backups
      PGB_HOST: pgbouncer_global
      PGB_PORT: 6432
      KEEP: 5
    volumes:
      - ./:/envs:ro
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    init: true
    restart: always
    entrypoint: []
    # crond ne transmet pas l'environnement du conteneur aux tâches : on le sauvegarde et on le recharge
    command: >
      /bin/sh -c "export -p > /tmp/backup.env &&
      echo '0 3 * * * . /tmp/backup.env && /bin/sh /backup.sh >> /proc/1/fd/1 2>&1' | crontab - &&
      crond -f -l 2"
    networks:
      - pgbouncer
